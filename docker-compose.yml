services:
  # ── Argus collector ────────────────────────────────────────────────
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    env_file: .env
    environment:
      ARGUS_FLEET_FILE: /etc/argus/fleet.yaml
    volumes:
      # Mounted (not baked in) so adding a target is an edit + restart,
      # with no image rebuild.
      - ./deploy/fleet.yaml:/etc/argus/fleet.yaml:ro
    ports:
      - "9100:9100"
    depends_on:
      pg-local:
        condition: service_healthy
      mysql-local:
        condition: service_healthy
      mongo-local:
        condition: service_healthy
      redis-cache-local:
        condition: service_healthy
      redis-session-local:
        condition: service_healthy
    restart: unless-stopped

  # ── Local database fleet (official Docker Hub images) ──────────────
  # Fixed throwaway credentials: these listen only on the compose network
  # and hold nothing but generated load. See deploy/fleet.yaml.
  pg-local:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    volumes:
      - pg-local-data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mysql-local:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: argus-root
      MYSQL_DATABASE: argus
      MYSQL_USER: argus
      MYSQL_PASSWORD: argus
    volumes:
      - mysql-local-data:/var/lib/mysql
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uargus", "-pargus"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongo-local:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: argus
      MONGO_INITDB_ROOT_PASSWORD: argus
    volumes:
      - mongo-local-data:/data/db
    ports:
      - "57017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # maxmemory is set explicitly so storage_pct has a real denominator
  # (without it Redis reports maxmemory=0 and the SLI is meaningless).
  redis-cache-local:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis-session-local:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ── Observability stack ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - collector
      - mimir
    restart: unless-stopped

  mimir:
    image: grafana/mimir:2.14.0
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    volumes:
      - ./deploy/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data
    ports:
      - "9009:9009"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - mimir
    restart: unless-stopped

volumes:
  mimir-data:
  pg-local-data:
  mysql-local-data:
  mongo-local-data:
