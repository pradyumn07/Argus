# Argus fleet definition — the single place you add or remove a target.
#
# Adding a database is a few lines of YAML here plus (for local targets) a
# service in docker-compose.yml. No Python changes, no rebuild: the file is
# mounted into the collector, so `docker compose restart collector` picks it up.
#
# dsn supports ${ENV_VAR} interpolation. A target whose referenced env var is
# unset or empty is SKIPPED, so a partial fleet still runs — that's how the
# cloud targets stay optional while the local ones always work.
#
# On credentials: the local targets below use fixed throwaway credentials for
# containers that only listen on the private compose network and hold nothing
# but generated load. They are deliberately NOT secrets and are safe to commit.
# Every real/hosted target uses ${ENV_VAR} and resolves from .env — those never
# get committed.
#
# slo overrides: optional, per target. A container on localhost and a
# cross-region free-tier cloud instance do not share a latency budget, so the
# hosted targets widen theirs. Engine defaults live in collector/config.py;
# anything overridden here needs the same one-line rationale.

defaults:
  poll_interval_s: 4
  region: local
  provider: docker

targets:
  # ── Local fleet (Docker Hub images, always available) ───────────────
  - id: pg-local
    engine: postgres
    dsn: postgresql://argus:argus@pg-local:5432/argus

  - id: mysql-local
    engine: mysql
    dsn: mysql://argus:argus@mysql-local:3306/argus

  - id: mongo-local
    engine: mongo
    database: orders
    dsn: mongodb://argus:argus@mongo-local:27017/?authSource=admin
    poll_interval_s: 3

  - id: redis-cache-local
    engine: redis
    dsn: redis://redis-cache-local:6379
    poll_interval_s: 2

  - id: redis-session-local
    engine: redis
    dsn: redis://redis-session-local:6379
    poll_interval_s: 2

  # ── Hosted fleet (free-tier cloud, optional) ────────────────────────
  # Skipped automatically when the env var is unset, so `docker compose up`
  # works on a clean checkout with no cloud accounts at all.
  - id: pg-neon
    engine: postgres
    provider: neon
    region: us-east
    dsn: ${NEON_DSN}
    slo:
      # Neon free tier is cross-region from here and cold-starts on idle;
      # a 50ms budget would flag it permanently for latency it cannot control.
      latency_ms: { warn: 400, crit: 1200 }

  - id: pg-supa
    engine: postgres
    provider: supabase
    region: us-east
    dsn: ${SUPA_DSN}
    slo:
      latency_ms: { warn: 400, crit: 1200 }  # same cross-region reasoning as pg-neon

  - id: mongo-orders
    engine: mongo
    provider: atlas
    region: us-east
    database: orders
    dsn: ${MONGO_URI}
    poll_interval_s: 3
    slo:
      # Atlas M0 shared tier, cross-region: ~90ms is its healthy baseline.
      latency_ms: { warn: 250, crit: 600 }

  - id: mongo-catalog
    engine: mongo
    provider: atlas
    region: us-east
    database: catalog
    dsn: ${MONGO_URI}
    poll_interval_s: 3
    slo:
      latency_ms: { warn: 250, crit: 600 }  # same M0 shared-tier reasoning

  - id: redis-cache
    engine: redis
    provider: upstash
    region: us-east
    dsn: ${REDIS_CACHE_URL}
    poll_interval_s: 2
    slo:
      # Upstash free tier over TLS from here; 10ms is a LAN budget, not a WAN one.
      latency_ms: { warn: 120, crit: 400 }

  - id: redis-session
    engine: redis
    provider: upstash
    region: us-east
    dsn: ${REDIS_SESSION_URL}
    poll_interval_s: 2
    slo:
      latency_ms: { warn: 120, crit: 400 }  # same WAN reasoning as redis-cache
