apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data
  namespace: argus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: argus
  labels: { app: mimir }
spec:
  replicas: 1
  strategy: { type: Recreate }  # ReadWriteOnce PVC
  selector:
    matchLabels: { app: mimir }
  template:
    metadata:
      labels: { app: mimir }
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:2.14.0
          args: ["-config.file=/etc/mimir/mimir.yaml"]
          ports:
            - containerPort: 9009
          volumeMounts:
            - name: config
              mountPath: /etc/mimir/mimir.yaml
              subPath: mimir.yaml
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /ready, port: 9009 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: 9009 }
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: config
          configMap: { name: argus-mimir-config }
        - name: data
          persistentVolumeClaim: { claimName: mimir-data }
---
apiVersion: v1
kind: Service
metadata:
  name: mimir  # DNS name referenced verbatim in deploy/prometheus/prometheus.yml
              # (remote_write) and deploy/grafana/provisioning/datasources
  namespace: argus
spec:
  selector: { app: mimir }
  ports:
    - port: 9009
      targetPort: 9009
