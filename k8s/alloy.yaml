apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: argus
---
# Alloy discovers pods and streams their logs through the API server, so it
# needs read access to pods and to the pods/log subresource. Cluster-scoped
# because discovery.kubernetes lists across the cluster — the config itself
# then filters down to the argus namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argus-alloy
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argus-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argus-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: argus
---
# DaemonSet, not Deployment: a log shipper belongs on every node. (This
# kind cluster has one node, but the shape should be right — swapping to a
# multi-node cluster shouldn't require rewriting the manifest.)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: argus
  labels: { app: alloy }
spec:
  selector:
    matchLabels: { app: alloy }
  template:
    metadata:
      labels: { app: alloy }
      annotations:
        # Stamped by k8s/generate.py from the ConfigMap content. Changing
        # config changes this, which changes the pod template, which is
        # what actually makes Kubernetes roll the pods. Do not hand-edit.
        argus.dev/config-hash: "542965f5220f1441"
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.5.1
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - { containerPort: 12345, name: http }
          volumeMounts:
            - name: config
              mountPath: /etc/alloy/config.alloy
              subPath: config.alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
          readinessProbe:
            httpGet: { path: /-/ready, port: 12345 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: argus-alloy-config }
        - name: data
          emptyDir: {}   # WAL/positions only; safe to lose on restart
