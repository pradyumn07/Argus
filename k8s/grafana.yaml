apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: argus
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          ports:
            - containerPort: 3000
          env:
            # Anonymous admin access — matches docker-compose.yml exactly.
            # Fine for a local kind cluster demo, not for anything shared.
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin" }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true }
            - { name: dashboards, mountPath: /etc/grafana/dashboards, readOnly: true }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: datasources
          configMap: { name: argus-grafana-datasources }
        - name: dashboard-provider
          configMap: { name: argus-grafana-dashboard-provider }
        - name: dashboards
          configMap: { name: argus-grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: argus
spec:
  selector: { app: grafana }
  ports:
    - port: 3000
      targetPort: 3000
