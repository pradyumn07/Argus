apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
  namespace: argus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: argus
  labels: { app: tempo }
spec:
  replicas: 1
  strategy: { type: Recreate }  # ReadWriteOnce PVC
  selector:
    matchLabels: { app: tempo }
  template:
    metadata:
      labels: { app: tempo }
    spec:
      securityContext:
        fsGroup: 10001  # tempo runs as uid 10001; needs to own /var/tempo
      containers:
        - name: tempo
          image: grafana/tempo:2.6.1
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - { containerPort: 3200, name: http }
            - { containerPort: 4318, name: otlp-http }
            - { containerPort: 4317, name: otlp-grpc }
          volumeMounts:
            - name: config
              mountPath: /etc/tempo/tempo.yaml
              subPath: tempo.yaml
              readOnly: true
            - name: data
              mountPath: /var/tempo
          readinessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 45
            periodSeconds: 15
      volumes:
        - name: config
          configMap: { name: argus-tempo-config }
        - name: data
          persistentVolumeClaim: { claimName: tempo-data }
---
apiVersion: v1
kind: Service
metadata:
  name: tempo  # collector posts OTLP to http://tempo:4318 (see k8s/collector.yaml)
  namespace: argus
spec:
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200, targetPort: 3200 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
