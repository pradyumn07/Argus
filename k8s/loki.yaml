apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: argus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: argus
  labels: { app: loki }
spec:
  replicas: 1
  strategy: { type: Recreate }  # ReadWriteOnce PVC
  selector:
    matchLabels: { app: loki }
  template:
    metadata:
      labels: { app: loki }
    spec:
      securityContext:
        # The image runs as uid 10001; the PVC mounts root-owned, so hand
        # the volume to that group or Loki can't create its chunk dirs.
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki/loki.yaml
              subPath: loki.yaml
              readOnly: true
            - name: data
              mountPath: /loki
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 45
            periodSeconds: 15
      volumes:
        - name: config
          configMap: { name: argus-loki-config }
        - name: data
          persistentVolumeClaim: { claimName: loki-data }
---
apiVersion: v1
kind: Service
metadata:
  name: loki  # DNS name referenced by the Alloy config and the Grafana datasource
  namespace: argus
spec:
  selector: { app: loki }
  ports:
    - port: 3100
      targetPort: 3100
