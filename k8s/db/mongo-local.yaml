apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-local-data
  namespace: argus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-local
  namespace: argus
  labels: { app: mongo-local }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: mongo-local }
  template:
    metadata:
      labels: { app: mongo-local }
    spec:
      containers:
        - name: mongo-local
          image: mongo:7
          ports:
            - containerPort: 27017
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: "argus" }
            - { name: MONGO_INITDB_ROOT_PASSWORD, value: "argus" }
          volumeMounts:
            - { name: data, mountPath: /data/db }
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"] }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"] }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mongo-local-data }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-local  # DNS name referenced verbatim in deploy/fleet.yaml's dsn
  namespace: argus
spec:
  selector: { app: mongo-local }
  ports:
    - port: 27017
      targetPort: 27017
