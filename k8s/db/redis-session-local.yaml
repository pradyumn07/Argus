# No PVC — same reasoning as redis-cache-local.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-session-local
  namespace: argus
  labels: { app: redis-session-local }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis-session-local }
  template:
    metadata:
      labels: { app: redis-session-local }
    spec:
      containers:
        - name: redis-session-local
          image: redis:7-alpine
          args: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-session-local  # DNS name referenced verbatim in deploy/fleet.yaml's dsn
  namespace: argus
spec:
  selector: { app: redis-session-local }
  ports:
    - port: 6379
      targetPort: 6379
