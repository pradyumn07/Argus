              "refId": "A"
            }
          ],
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "textMode": "value",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "decimals": 2,
              "color": { "mode": "fixed", "fixedColor": "blue" }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Error Rate",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "argus-mimir" },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
