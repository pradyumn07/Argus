  argus-instance.json: |
    {
      "title": "Argus â€” Instance Detail",
      "uid": "argus-instance",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "10s",
      "tags": ["argus"],
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "instance",
            "label": "Instance",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "argus-mimir" },
            "query": "label_values(argus_status_level, instance_id)",
            "refresh": 2,
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Current Status",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "argus-mimir" },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "argus_status_level{instance_id=\"$instance\"}",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "background",
            "textMode": "value",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 2 }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "HEALTHY", "index": 0 },
                    "1": { "text": "WARNING", "index": 1 },
                    "2": { "text": "CRITICAL", "index": 2 }
                  }
                }
              ]
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Latency",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "argus-mimir" },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "argus_latency_ms{instance_id=\"$instance\"}",
              "instant": false,
              "refId": "A"
            }
          ],
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "textMode": "value",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "decimals": 1,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red", "value": 150 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Throughput",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "argus-mimir" },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "argus_ops_sec{instance_id=\"$instance\"}",
              "instant": false,
              "refId": "A"
            }
          ],
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "textMode": "value",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "decimals": 2,
              "color": { "mode": "fixed", "fixedColor": "blue" }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Error Rate",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "argus-mimir" },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "expr": "argus_err_rate{instance_id=\"$instance\"}",
              "instant": false,
              "refId": "A"
            }
          ],
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "textMode": "value",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.01 },
                  { "color": "red", "value": 0.03 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "Status Timeline",
          "type": "state-timeline",
          "datasource": { "type": "prometheus", "uid": "argus-mimir" },
          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 5 },
          "targets": [
            {
              "expr": "argus_status_level{instance_id=\"$instance\"}",
              "legendFormat": "$instance",
              "refId": "A"
            }
          ],
          "options": {
            "mergeValues": true,
            "showValue": "auto",
            "rowHeight": 0.9,
            "alignValue": "center",
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": { "lineWidth": 0, "fillOpacity": 90 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 2 }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": { "text": "healthy", "index": 0 },
                    "1": { "text": "warning", "index": 1 },
                    "2": { "text": "critical", "index": 2 }
                  }
                }
              ]
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "title": "Latency over time",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "argus-mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "targets": [
            { "expr": "argus_latency_ms{instance_id=\"$instance\"}", "legendFormat": "latency", "refId": "A" }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": true,
                "gradientMode": "opacity"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "title": "Throughput over time",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "argus-mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "targets": [
            { "expr": "argus_ops_sec{instance_id=\"$instance\"}", "legendFormat": "ops/sec", "refId": "A" }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": true,
                "gradientMode": "opacity"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "title": "Connection Saturation",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "argus-mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 18 },
          "targets": [
            { "expr": "argus_conn_pct{instance_id=\"$instance\"}", "legendFormat": "connections", "refId": "A" }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": true,
                "thresholdsStyle": { "mode": "dashed" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "transparent", "value": null },
                  { "color": "red", "value": 0.9 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "title": "Cache Hit Ratio",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "argus-mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 18 },
          "targets": [
            { "expr": "argus_cache_hit_ratio{instance_id=\"$instance\"}", "legendFormat": "cache hit", "refId": "A" }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "noValue": "not reported by this engine",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": true,
                "thresholdsStyle": { "mode": "dashed" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "transparent", "value": 0.95 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "title": "Storage Used",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "argus-mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 18 },
          "targets": [
            { "expr": "argus_storage_pct{instance_id=\"$instance\"}", "legendFormat": "storage", "refId": "A" }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": true,
                "thresholdsStyle": { "mode": "dashed" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "transparent", "value": null },
                  { "color": "red", "value": 0.9 }
                ]
              }
            },
            "overrides": []
          }
        }
      ]
    }
kind: ConfigMap
