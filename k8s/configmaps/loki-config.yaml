apiVersion: v1
data:
  loki.yaml: |
    # Loki single-binary mode — filesystem storage, replication_factor 1.
    # Same honest tradeoff as Mimir (see BUILD_PLAN.md): this is not how you'd
    # run Loki at scale (that's the distributed chart + object storage), but
    # the ingest path, the schema, and every LogQL query are identical, so
    # nothing you learn here is a toy.

    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 168h          # 7 days is plenty for a demo fleet
      allow_structured_metadata: true
      volume_enabled: true            # powers the log-volume histogram in Explore

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules

    analytics:
      reporting_enabled: false
kind: ConfigMap
metadata:
  name: argus-loki-config
  namespace: argus
